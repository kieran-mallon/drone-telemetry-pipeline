# The whole pipeline, locally, with one command:
#
#   docker compose up --build
#
# Postgres, MinIO (S3), ElasticMQ (SQS), migrations, the processor and the read
# API. Every image here is open source and needs no account or licence key.
#
# LocalStack used to fill the MinIO and ElasticMQ roles in a single container.
# It retired its free image in March 2026 and now requires an auth token, which
# would mean nobody could run this without signing up. See
# docker-compose.localstack.yml if you do have a token.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: drone
      POSTGRES_PASSWORD: drone
      POSTGRES_DB: telemetry
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Dependents wait on this, so nothing races a database that is listening
      # but not yet accepting connections.
      test: ['CMD-SHELL', 'pg_isready -U drone -d telemetry']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3. The AWS SDK talks to it unmodified, so the real S3 adapter is exercised.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # web console, handy for seeing uploaded objects
    volumes:
      - minio-data:/data

  # Creates the bucket, then exits. A retry loop rather than a healthcheck on
  # MinIO itself: the server image does not reliably ship a tool to probe with,
  # and polling until the API answers is the more robust check anyway.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do
          echo 'waiting for minio...'
          sleep 1
        done
        mc mb --ignore-existing local/drone-telemetry-raw
        echo 'bucket drone-telemetry-raw ready'
    restart: 'no'

  # SQS. Queues and the redrive policy are declared in docker/elasticmq.conf.
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - '9324:9324'
    volumes:
      - ./docker/elasticmq.conf:/opt/elasticmq.conf:ro

  migrate:
    build: .
    command: ['node', 'dist/adapters/postgres/migrate.js']
    environment:
      DATABASE_URL: postgres://drone:drone@postgres:5432/telemetry
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  processor:
    build: .
    command: ['node', 'dist/runtime/poller.js']
    environment:
      DATABASE_URL: postgres://drone:drone@postgres:5432/telemetry
      AWS_REGION: eu-west-1
      # Two servers, so two endpoints. Both unset in a real deployment, which is
      # the entire difference between this runtime and the Lambda.
      S3_ENDPOINT_URL: http://minio:9000
      SQS_ENDPOINT_URL: http://elasticmq:9324
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      RAW_BUCKET: drone-telemetry-raw
      # Resolved to a URL at runtime via GetQueueUrl, so no URL format is
      # hardcoded anywhere.
      INGEST_QUEUE_NAME: drone-telemetry-ingest
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_started
    restart: unless-stopped

  api:
    build: .
    command: ['node', 'dist/runtime/api.js']
    environment:
      DATABASE_URL: postgres://drone:drone@postgres:5432/telemetry
      S3_ENDPOINT_URL: http://minio:9000
      SQS_ENDPOINT_URL: http://elasticmq:9324
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      API_PORT: 3000
      LOG_LEVEL: info
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
