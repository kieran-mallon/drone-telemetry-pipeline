# ElasticMQ: an SQS-compatible queue server, Apache 2.0 licensed.
#
# The queues are declared here rather than created by a script so the local
# topology is visible in one file. This mirrors the SQS resources defined in
# infra/index.ts, including the redrive policy.

include classpath("application.conf")

node-address {
    protocol = http
    host = "elasticmq"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    # Reject anything real SQS would reject, so a local success is meaningful.
    sqs-limits = strict
}

queues {
    # Declared first: the ingest queue's redrive policy references it.
    drone-telemetry-dlq {
        defaultVisibilityTimeout = 60 seconds
    }

    drone-telemetry-ingest {
        defaultVisibilityTimeout = 60 seconds
        deadLettersQueue {
            name = "drone-telemetry-dlq"
            # Same as the Pulumi definition: three failures means it will not
            # succeed on the fourth.
            maxReceiveCount = 3
        }
    }
}
